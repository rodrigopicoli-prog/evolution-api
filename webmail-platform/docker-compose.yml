services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm install && npx prisma migrate deploy && npm run seed && npm run start:dev"
    volumes:
      - ./backend:/app
    working_dir: /app

  worker:
    build:
      context: ./worker
    env_file: .env
    depends_on:
      - backend
    command: sh -c "npm install && npm run start"
    volumes:
      - ./worker:/app
    working_dir: /app

  frontend:
    build:
      context: ./frontend
    env_file: .env
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    working_dir: /app

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
